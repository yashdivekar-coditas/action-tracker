# actiontrack configuration. Copy to ./actiontrack.toml (git-ignored) or
# ~/.config/actiontrack/actiontrack.toml and fill in. Only `followup` needs it.
# It holds no passwords or tokens: Gmail sign-in belongs to the MCP server.

# Signs every Follow-up Draft.
sender = "Your Name"

[gmail]
# Launch command of a stdio Gmail MCP server, as an argument list (never run through a shell).
# Sign-in belongs to the server: once, run `npx @artymclabin/gmail-mcp auth --scopes=gmail.compose`.
command = ["npx", "-y", "@artymclabin/gmail-mcp"]
# The server's create-draft tool. Names containing send, reply or forward are refused.
draft_tool = "draft_email"

# The People Roster: one [[people]] table per Person. Aliases are optional.
# Full names and aliases must be unique (ignoring case) across the roster.
[[people]]
name = "Priya Nair"
email = "priya.nair@example.com"
aliases = ["Priya N."]

[[people]]
name = "Anita Desai"
email = "anita.desai@example.com"
aliases = ["anita"]
